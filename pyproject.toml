[project]
name = "dungeon-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Donald Barre", email = "dbarre62@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "gradio>=6.24.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.5",
    "langgraph>=1.2.12",
    "openai>=3.19.2",
    "pydantic<=2.12.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
dungeon-game = "dungeon_game:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
